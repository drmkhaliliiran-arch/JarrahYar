name: Build JarrahYar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q JarrahYar_Android_Project_AutoBuild-1.zip -d project
          echo "Project files:"
          find project -maxdepth 3 -type f | head -100

      - name: Build APK
        run: |
          GRADLE_FILE=$(find project -type f -name build.gradle -o -name build.gradle.kts | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle build file not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JarrahYar-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
