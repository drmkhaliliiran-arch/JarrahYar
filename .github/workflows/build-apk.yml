name: Build JarrahYar APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Extract Android project
    run: |
      unzip -o JarrahYar_Android_Project_AutoBuild-1.zip -d android_project
      echo "Extracted project files:"
      find android_project -maxdepth 3 -type f | head -100

  - name: Locate Gradle project
    run: |
      find android_project -name settings.gradle -o -name settings.gradle.kts

  - name: Show project files
    run: |
      ls -la
      ls -la android_project
