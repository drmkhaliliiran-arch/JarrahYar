name: Build JarrahYar APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Show project files
    run: ls -la

  - name: Check project structure
    run: |
      echo "Checking for Android project files"
      find . -maxdepth 3 -type f | head -200
